[project]
name = "wm2cx"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "PRAJAK", email = "prajaksen.s@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "av>=19.0.2",
    "einops>=0.8.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "safetensors>=0.8.0",
    "scipy>=1.18.1",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
    "transformers>=5.21.0",
]

[project.scripts]
wm2cx = "wm2cx:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
